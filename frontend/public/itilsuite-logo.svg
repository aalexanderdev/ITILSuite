<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- ITILSuite 3D Monolith Mark / Isometric "I" -->
  <g transform="translate(6, 0)">
    <!-- Left Wireframe Face -->
    <polygon
      points="10,12 28,6 28,54 10,48"
      fill="none"
      stroke="#EB4D3D"
      stroke-width="3.2"
      stroke-linejoin="round"
    />
    <!-- Right Solid Face -->
    <polygon
      points="28,6 46,12 46,48 28,54"
      fill="#EB4D3D"
      stroke="#EB4D3D"
      stroke-width="1"
      stroke-linejoin="round"
    />
  </g>

  <!-- Wordmark "TILSUITE" -->
  <text
    x="62"
    y="49"
    fill="#EB4D3D"
    font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="46"
    font-weight="900"
    font-style="italic"
    letter-spacing="0.01em"
    style="font-stretch: condensed; text-transform: uppercase;"
  >
    TILSUITE
  </text>
</svg>
