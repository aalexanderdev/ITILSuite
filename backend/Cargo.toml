[package]
name = "itilsuite-backend"
version = "0.0.6"
edition = "2021"
authors = ["ITILSuite Contributors"]
description = "High-performance Rust backend for ITILSuite"
license = "GPL-3.0-or-later"

[dependencies]
# Async Runtime & Web Framework
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros", "ws"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database & Migrations
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "json"] }

# Authentication & Password Hashing
argon2 = "0.5"
password-hash = "0.5"
jsonwebtoken = "9.3"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
regex = "1.10"
ipnet = "2.10"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
dotenvy = "0.15"

# OpenAPI & Documentation
utoipa = { version = "4.2", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7.1", features = ["axum"] }

[dev-dependencies]
http-body-util = "0.1"
