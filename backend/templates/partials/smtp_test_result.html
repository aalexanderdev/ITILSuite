{% if success %}
<div style="margin-top: 0.85rem; padding: 0.85rem 1rem; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: var(--radius-sm); display: flex; align-items: flex-start; gap: 0.75rem;">
  <span style="font-size: 1.2rem; color: #10b981;">✅</span>
  <div>
    <div style="font-weight: 700; font-size: 0.9rem; color: #10b981;">Conexión SMTP Exitosa</div>
    <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.2rem;">
      {{ message }}
    </div>
    <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.35rem;">
      💡 Si utilizas Mailpit en local, puedes verificar la recepción abriendo <a href="http://localhost:8025" target="_blank" rel="noopener noreferrer" style="color: #60a5fa; text-decoration: underline;">http://localhost:8025</a>.
    </div>
  </div>
</div>
{% else %}
<div style="margin-top: 0.85rem; padding: 0.85rem 1rem; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: var(--radius-sm); display: flex; align-items: flex-start; gap: 0.75rem;">
  <span style="font-size: 1.2rem; color: #ef4444;">❌</span>
  <div>
    <div style="font-weight: 700; font-size: 0.9rem; color: #ef4444;">Fallo de Envío SMTP</div>
    <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.2rem;">
      {{ message }}
    </div>
  </div>
</div>
{% endif %}
