<header class="navbar">
  <!-- Left: Brand Logo & Title -->
  <div class="navbar-brand">
    <a href="/dashboard" style="display: flex; align-items: center; gap: 0.65rem; text-decoration: none; color: inherit;">
      <div class="brand-icon-wrapper" style="width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--btn-primary-from, #eb4d3d), #f59e0b); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 1rem;">
        ⚡
      </div>
      <div>
        <span class="brand-title" style="font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em;">ITILSuite</span>
        <span class="badge badge-coral" style="font-size: 0.6rem; margin-left: 0.35rem; vertical-align: middle;">v0.0.8</span>
      </div>
    </a>
  </div>

  <!-- Center: Live Search bar -->
  <div class="navbar-center" style="flex: 1; max-width: 480px; margin: 0 1.5rem;">
    <div style="position: relative; width: 100%;">
      <span style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 0.85rem;">🔍</span>
      <input
        type="search"
        placeholder="Buscar tickets, activos, usuarios o reglas (Ctrl+K)..."
        class="input-search"
        style="width: 100%; padding: 0.45rem 0.85rem 0.45rem 2.2rem; border-radius: 9999px; background: var(--card-subtle-bg); border: 1px solid var(--border-subtle); color: var(--text-primary); font-size: 0.8rem;"
      />
    </div>
  </div>

  <!-- Right: Entity Scope & Controls -->
  <div class="navbar-actions" style="display: flex; align-items: center; gap: 0.75rem;">
    <!-- Active Entity Badge -->
    <div style="display: flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.65rem; border-radius: var(--radius-sm, 8px); background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.25); color: #38bdf8; font-size: 0.75rem; font-weight: 600;">
      <span>🏢</span>
      <span>{{ active_entity_name }}</span>
    </div>

    <!-- Theme Switcher -->
    <button
      type="button"
      onclick="toggleTheme()"
      class="btn-icon"
      style="width: 34px; height: 34px; border-radius: 50%; background: var(--card-subtle-bg); border: 1px solid var(--border-subtle); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9rem;"
      title="Cambiar tema visual"
    >
      🌓
    </button>

    <!-- User / Profile pill -->
    <div style="display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0.65rem 0.25rem 0.35rem; border-radius: 9999px; background: var(--card-subtle-bg); border: 1px solid var(--border-subtle);">
      <div style="width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #eb4d3d, #f59e0b); display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; color: white;">
        {{ user_initials }}
      </div>
      <span style="font-size: 0.78rem; font-weight: 600; color: var(--text-primary);">{{ current_username }}</span>
    </div>
  </div>
</header>
