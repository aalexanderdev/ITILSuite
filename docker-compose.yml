services:
  postgres:
    image: postgres:16-alpine
    container_name: itilsuite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: itilsuite
      POSTGRES_PASSWORD: itilsuite_dev_password
      POSTGRES_DB: itilsuite_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itilsuite -d itilsuite_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Mailpit for local email testing (tickets, SLAs, and ITIL notifications)
  mailpit:
    image: axllent/mailpit:latest
    container_name: itilsuite-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: "" # In-memory

volumes:
  postgres_data:
    driver: local
